# Keeps the hosted demo awake: a free Render web service sleeps after 15 minutes without
# visitors, which would stop the guardians mid-loan. Set the repository variable RENDER_URL
# (Settings -> Secrets and variables -> Actions -> Variables) to the service's address.
name: keep the demo awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.RENDER_URL != '' }}
    steps:
      - run: curl -s -o /dev/null -w "%{http_code}\n" --max-time 90 "${{ vars.RENDER_URL }}/api/state" || true
