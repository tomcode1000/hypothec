name: test, build and deploy

# Every push to main: run the tests, build the demo image (deploy/Dockerfile) and push it to
# ghcr.io, then ask Render to deploy it (RENDER_DEPLOY_HOOK secret; skipped if not set).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shielded vault tools (circuit keys are committed in shield/build)
        working-directory: shield
        run: npm ci
      - name: Contract tests
        working-directory: usdc
        run: npm ci && npx hardhat test
      - name: Rules and loanbook tests
        working-directory: services
        run: npm ci && npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK not set: image built, not deployed"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "deploy requested"
